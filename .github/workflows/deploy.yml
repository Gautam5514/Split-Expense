name: Deploy Backend to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            # Stop on the first failing command instead of silently
            # continuing with stale code.
            set -e

            cd ~/Split-Expense

            # Force the server to match exactly what was pushed - a plain
            # `git pull` silently fails if the server copy has local edits.
            git fetch origin main
            git reset --hard origin/main

            cd backend

            npm install --production

            pm2 restart index --update-env
            pm2 save
