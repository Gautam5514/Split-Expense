name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            cd /var/www/split-backend/Split-Expense

            git fetch origin main
            git reset --hard origin/main

            cd backend

            # npm ci was OOM-killed (exit 137) on the small EC2 instance, so add
            # a 2G swapfile once if the box has no swap.
            if [ "$(swapon --show --noheadings | wc -l)" -eq 0 ]; then
              sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              grep -q '^/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi
            free -m

            NODE_OPTIONS=--max-old-space-size=512 npm ci --omit=dev --no-audit --no-fund

            pm2 restart split-backend --update-env
            pm2 save

            echo "Backend deployment completed successfully"