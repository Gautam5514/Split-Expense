name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Backend to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            cd /var/www/split-backend/Split-Expense

            # Show disk usage up front so a full disk is obvious in the logs.
            echo "=== Disk usage before cleanup ==="
            df -h /

            # The deploy was failing with:
            #   fatal: unable to write loose object file: No space left on device
            # Free up space before fetching. All of these are safe to remove:
            # npm's cache, old pm2 logs, apt caches, and dangling git objects.
            npm cache clean --force 2>/dev/null || true
            pm2 flush 2>/dev/null || true
            sudo journalctl --vacuum-time=3d 2>/dev/null || true
            sudo apt-get clean 2>/dev/null || true

            # Compact the local git repo and drop unreachable objects.
            git gc --prune=now --aggressive 2>/dev/null || true

            echo "=== Disk usage after cleanup ==="
            df -h /

            # Abort early with a clear message if the disk is still nearly full.
            USED_PCT=$(df --output=pcent / | tail -1 | tr -dc '0-9')
            if [ "${USED_PCT:-0}" -ge 95 ]; then
              echo "ERROR: root disk is ${USED_PCT}% full; free space before deploying." >&2
              exit 1
            fi

            git fetch origin main
            git reset --hard origin/main

            cd backend

            # npm ci was OOM-killed (exit 137) on the small EC2 instance, so add
            # a 2G swapfile once if the box has no swap.
            if [ "$(swapon --show --noheadings | wc -l)" -eq 0 ]; then
              sudo fallocate -l 2G /swapfile
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              grep -q '^/swapfile' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi
            free -m

            NODE_OPTIONS=--max-old-space-size=512 npm ci --omit=dev --no-audit --no-fund

            pm2 restart split-backend --update-env
            pm2 save

            echo "Backend deployment completed successfully"