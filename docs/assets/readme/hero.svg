  <text x="94" y="282" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="27" font-weight="600" letter-spacing="-.4" fill="url(#brand)">Split bills. Not friendships.</text>
