      <circle cx="409" cy="255" r="17"/><path d="M385 301q24-34 48 0l12 17h-72z"/>
      <circle cx="361" cy="374" r="17"/><path d="M337 420q24-34 48 0l12 17h-72z"/>
    </g>
  </g>

  <!-- Everyone connects to the same shared expense. -->
  <g fill="none" stroke="url(#lg-bridge)" stroke-width="9" stroke-linecap="round">
    <path d="M177 190Q211 212 229 239"/><path d="M128 311q47 1 78 28"/><path d="M196 402q30-11 50-40"/>
    <path d="M316 178q-27 24-35 61"/><path d="M384 294q-42 8-72 39"/><path d="M337 402q-35-11-61-41"/>
  </g>

  <!-- Core product symbol: six equal shares, one balanced settlement. -->
  <g transform="translate(256 276)" filter="url(#lg-coreGlow)">
    <circle r="67" fill="#030814" stroke="url(#lg-splitDisc)" stroke-width="6"/>
    <circle r="56" fill="#0b1422" stroke="#dbeafe" stroke-width="3"/>
    <circle r="42" fill="none" stroke="url(#lg-splitDisc)" stroke-width="4"/>
    <g stroke="url(#lg-splitDisc)" stroke-width="3">
