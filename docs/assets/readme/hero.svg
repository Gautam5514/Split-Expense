      <circle cx="0" cy="32" r="3.5"/><circle cx="-27.7" cy="16" r="3.5"/><circle cx="-27.7" cy="-16" r="3.5"/>
    </g>
  </g>
  <circle cx="256" cy="276" r="77" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="3 9" opacity=".7"/>
</svg>

