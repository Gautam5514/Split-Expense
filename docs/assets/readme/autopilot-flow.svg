<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" viewBox="0 0 1280 250" role="img" aria-label="Autopilot: you ask, it plans, you approve, it verifies">
  <title>Autopilot: you ask, it plans, you approve, it verifies</title>
  <defs>
    <radialGradient id="glowV" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 120) scale(520 360)">
      <stop stop-color="#7c3aed" stop-opacity=".34"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1060 380) scale(520 340)">
      <stop stop-color="#06b6d4" stop-opacity=".26"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#c4b5fd"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#ffffff" stop-opacity=".16"/><stop offset=".5" stop-color="#ffffff" stop-opacity=".04"/><stop offset="1" stop-color="#67e8f9" stop-opacity=".22"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>
  <style>.flow{animation:dash 1.2s linear infinite}@keyframes dash{to{stroke-dashoffset:-24}}@media (prefers-reduced-motion:reduce){.flow{animation:none}}</style>
<rect width="1280" height="250" rx="24" fill="#05060a"/><rect width="1280" height="250" rx="24" fill="url(#grid)"/><rect x=".5" y=".5" width="1279" height="249" rx="23.5" fill="none" stroke="url(#edge)"/><text x="58.0" y="46" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#c4b5fd">AUTOPILOT · EVERY REQUEST, SAME FOUR STEPS</text>
  <clipPath id="step0"><rect x="58.0" y="76" width="252" height="132" rx="20"/></clipPath>
  <rect x="58.0" y="76" width="252" height="132" rx="20" fill="#0b0b10" stroke="#a78bfa" stroke-opacity=".32"/>
  <circle cx="284.0" cy="102" r="44" fill="#a78bfa" fill-opacity=".07" clip-path="url(#step0)"/>
  <text x="80.0" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#a78bfa">01</text>
  <text x="80.0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">You ask</text>
  <text x="80.0" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" fill-opacity=".55">“rent 21000, split equally”</text><line class="flow" x1="318.0" y1="142" x2="352.0" y2="142" stroke="#ffffff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="6 6"/><path d="M346.0 136l7 6-7 6" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
  <clipPath id="step1"><rect x="362.0" y="76" width="252" height="132" rx="20"/></clipPath>
  <rect x="362.0" y="76" width="252" height="132" rx="20" fill="#0b0b10" stroke="#c4b5fd" stroke-opacity=".32"/>
  <circle cx="588.0" cy="102" r="44" fill="#c4b5fd" fill-opacity=".07" clip-path="url(#step1)"/>
  <text x="384.0" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#c4b5fd">02</text>
  <text x="384.0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">It plans</text>
  <text x="384.0" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" fill-opacity=".55">₹5,250 each · 4 people · paid by you</text><line class="flow" x1="622.0" y1="142" x2="656.0" y2="142" stroke="#ffffff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="6 6"/><path d="M650.0 136l7 6-7 6" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
  <clipPath id="step2"><rect x="666.0" y="76" width="252" height="132" rx="20"/></clipPath>
  <rect x="666.0" y="76" width="252" height="132" rx="20" fill="#0b0b10" stroke="#67e8f9" stroke-opacity=".32"/>
  <circle cx="892.0" cy="102" r="44" fill="#67e8f9" fill-opacity=".07" clip-path="url(#step2)"/>
  <text x="688.0" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#67e8f9">03</text>
  <text x="688.0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">You approve</text>
  <text x="688.0" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" fill-opacity=".55">hashed + versioned, 24 h expiry</text><line class="flow" x1="926.0" y1="142" x2="960.0" y2="142" stroke="#ffffff" stroke-opacity=".35" stroke-width="2" stroke-dasharray="6 6"/><path d="M954.0 136l7 6-7 6" fill="none" stroke="#ffffff" stroke-opacity=".5" stroke-width="2" stroke-linecap="round"/>
  <clipPath id="step3"><rect x="970.0" y="76" width="252" height="132" rx="20"/></clipPath>
  <rect x="970.0" y="76" width="252" height="132" rx="20" fill="#0b0b10" stroke="#34d399" stroke-opacity=".32"/>
  <circle cx="1196.0" cy="102" r="44" fill="#34d399" fill-opacity=".07" clip-path="url(#step3)"/>
  <text x="992.0" y="116" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#34d399">04</text>
  <text x="992.0" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#ffffff">It verifies</text>
  <text x="992.0" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#ffffff" fill-opacity=".55">transaction, read back, idempotent</text>
</svg>
