<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="250" aria-label="Autopilot: you ask, it plans, you approve, it verifies" role="img" viewBox="0 0 1280 250"><title>Autopilot: you ask, it plans, you approve, it verifies</title><defs><radialGradient id="glowV" cx="0" cy="0" r="1" gradientTransform="translate(250 120) scale(520 360)" gradientUnits="userSpaceOnUse"><stop stop-color="#7c3aed" stop-opacity=".34"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient><radialGradient id="glowC" cx="0" cy="0" r="1" gradientTransform="translate(1060 380) scale(520 340)" gradientUnits="userSpaceOnUse"><stop stop-color="#06b6d4" stop-opacity=".26"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient><linearGradient id="brand" x1="0" x2="1" y1="0" y2="0"><stop stop-color="#c4b5fd"/><stop offset=".5" stop-color="#fff"/><stop offset="1" stop-color="#67e8f9"/></linearGradient><linearGradient id="edge" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#fff" stop-opacity=".16"/><stop offset=".5" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#67e8f9" stop-opacity=".22"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#fff" stroke-opacity=".035" d="M40 0H0V40"/></pattern></defs><style>.flow{animation:dash 1.2s linear infinite}@media (prefers-reduced-motion:reduce){.flow{animation:none}}</style><rect width="1280" height="250" fill="#05060a" rx="24"/><rect width="1280" height="250" fill="url(#grid)" rx="24"/><rect width="1279" height="249" x=".5" y=".5" fill="none" stroke="url(#edge)" rx="23.5"/><text x="58" y="46" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="2">AUTOPILOT · EVERY REQUEST, SAME FOUR STEPS</text><clipPath id="step0"><rect width="252" height="132" x="58" y="76" rx="20"/></clipPath><rect width="252" height="132" x="58" y="76" fill="#0b0b10" stroke="#a78bfa" stroke-opacity=".32" rx="20"/><circle cx="284" cy="102" r="44" fill="#a78bfa" fill-opacity=".07" clip-path="url(#step0)"/><text x="80" y="116" fill="#a78bfa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">01</text><text x="80" y="152" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700">You ask</text><text x="80" y="182" fill="#fff" fill-opacity=".55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="13">“rent 21000, split equally”</text><line x1="318" x2="352" y1="142" y2="142" stroke="#fff" stroke-dasharray="6 6" stroke-opacity=".35" stroke-width="2" class="flow"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-opacity=".5" stroke-width="2" d="M346.0 136l7 6-7 6"/><clipPath id="step1"><rect width="252" height="132" x="362" y="76" rx="20"/></clipPath><rect width="252" height="132" x="362" y="76" fill="#0b0b10" stroke="#c4b5fd" stroke-opacity=".32" rx="20"/><circle cx="588" cy="102" r="44" fill="#c4b5fd" fill-opacity=".07" clip-path="url(#step1)"/><text x="384" y="116" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">02</text><text x="384" y="152" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700">It plans</text><text x="384" y="182" fill="#fff" fill-opacity=".55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="13">₹5,250 each · 4 people · paid by you</text><line x1="622" x2="656" y1="142" y2="142" stroke="#fff" stroke-dasharray="6 6" stroke-opacity=".35" stroke-width="2" class="flow"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-opacity=".5" stroke-width="2" d="M650.0 136l7 6-7 6"/><clipPath id="step2"><rect width="252" height="132" x="666" y="76" rx="20"/></clipPath><rect width="252" height="132" x="666" y="76" fill="#0b0b10" stroke="#67e8f9" stroke-opacity=".32" rx="20"/><circle cx="892" cy="102" r="44" fill="#67e8f9" fill-opacity=".07" clip-path="url(#step2)"/><text x="688" y="116" fill="#67e8f9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">03</text><text x="688" y="152" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700">You approve</text><text x="688" y="182" fill="#fff" fill-opacity=".55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="13">hashed + versioned, 24 h expiry</text><line x1="926" x2="960" y1="142" y2="142" stroke="#fff" stroke-dasharray="6 6" stroke-opacity=".35" stroke-width="2" class="flow"/><path fill="none" stroke="#fff" stroke-linecap="round" stroke-opacity=".5" stroke-width="2" d="M954.0 136l7 6-7 6"/><clipPath id="step3"><rect width="252" height="132" x="970" y="76" rx="20"/></clipPath><rect width="252" height="132" x="970" y="76" fill="#0b0b10" stroke="#34d399" stroke-opacity=".32" rx="20"/><circle cx="1196" cy="102" r="44" fill="#34d399" fill-opacity=".07" clip-path="url(#step3)"/><text x="992" y="116" fill="#34d399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700">04</text><text x="992" y="152" fill="#fff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="21" font-weight="700">It verifies</text><text x="992" y="182" fill="#fff" fill-opacity=".55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif" font-size="13">transaction, read back, idempotent</text></svg>